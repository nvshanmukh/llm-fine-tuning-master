[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-finetuning-platform"
version = "0.1.0"
description = "Domain-Specific LLM Fine-Tuning & Evaluation Platform (Finance)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
prepare-data = "scripts.prepare_data:main"
train-model = "scripts.train:main"
evaluate-model = "scripts.evaluate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.ignore = ["BLE001", "RUF015", "PLC0206", "S110"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
