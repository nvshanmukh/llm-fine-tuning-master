# Finance LLM Inference API — Docker Compose configuration
# Usage: docker-compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: finance-llm-api:latest
    container_name: finance_llm_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - INFERENCE_MODEL_PATH=${INFERENCE_MODEL_PATH:-Qwen/Qwen2.5-1.5B}
      - INFERENCE_ADAPTER_PATH=${INFERENCE_ADAPTER_PATH:-}
      - LOAD_IN_4BIT=${LOAD_IN_4BIT:-false}
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Mount local experiments dir so the container can use fine-tuned adapters
      - ./experiments:/app/experiments:ro
      # Mount HuggingFace cache to avoid re-downloading on restart
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  hf_cache:
