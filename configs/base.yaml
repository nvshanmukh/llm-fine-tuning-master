# Base configuration — shared across all experiments
project:
  name: finance-llm-finetuning
  seed: 42
  output_dir: ./experiments
  # Recent MLflow rejects the legacy ./mlruns file store; use a local SQLite DB.
  # Override with the MLFLOW_TRACKING_URI env var.
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_experiment_name: finance-llm

model:
  model_name_or_path: Qwen/Qwen2.5-1.5B
  # Pinned commit on the HF Hub for reproducibility (as of 2026-09-08).
  revision: 8faed761d45a263340a0528343f099c05c9a4323
  # Set to null to disable quantization (for LoRA full-precision training)
  load_in_4bit: false
  load_in_8bit: false
  torch_dtype: bfloat16  # bfloat16 for A100/H100; float16 for T4
  trust_remote_code: true
  use_flash_attention_2: false  # Enable if GPU supports it (e.g. A100)

data:
  dataset_name: gbharti/finance-alpaca
  # Pinned dataset commit on the HF Hub (as of 2026-09-08).
  dataset_revision: c88d3d5e7e2c7cab9f11a56f27bd5ba3ed68f075
  dataset_cache_dir: ./data/raw
  processed_dir: ./data/processed
  max_seq_length: 512
  # Fraction of full dataset to use (1.0 = full dataset)
  train_fraction: 1.0
  val_fraction: 0.05   # 5% of train for validation
  test_fraction: 0.1   # Hold out 10% as test set

generation:
  max_new_tokens: 256
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.1
  do_sample: true
