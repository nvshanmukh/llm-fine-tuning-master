# Ablation study configuration grid
# Run train.py --ablation to sweep over these
ablation_grid:
  lora_rank:
    - 8
    - 16
    - 32
  learning_rate:
    - 1.0e-4
    - 2.0e-4
    - 5.0e-4
  num_train_epochs:
    - 2
    - 3

# Base settings for ablation runs
base:
  peft_type: LORA
  task_type: CAUSAL_LM
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  max_seq_length: 512
