# Ablation / hyperparameter sweep grid.
#
#   python scripts/train.py --config configs/lora.yaml --ablation
#
# Runs the full cross-product below (3 x 3 x 2 = 18 runs), each tracked as its
# own MLflow run; failed runs are recorded in experiments/ablation_results.json
# with their error instead of aborting the sweep.
#
# Primary question (one variable at a time): holding lr=2e-4 and epochs=3 fixed,
# does raising the LoRA rank 8 -> 16 -> 32 materially improve validation loss and
# test ROUGE-L, relative to the extra trainable parameters?
ablation_grid:
  lora_rank: [8, 16, 32]
  learning_rate: [1.0e-4, 2.0e-4, 5.0e-4]
  num_train_epochs: [2, 3]
