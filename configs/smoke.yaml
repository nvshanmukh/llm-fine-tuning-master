# Plumbing-only LoRA config: tiny model, a few steps, CPU-friendly.
# Proves the training path (PEFT target resolution, optimizer steps, adapter
# save/reload, MLflow logging) end to end. It says NOTHING about model quality.
#
#   python scripts/train.py --config configs/smoke.yaml --max-train-samples 32
project:
  name: finance-llm-finetuning
  seed: 42
  output_dir: ./experiments
  mlflow_tracking_uri: ./mlruns
  mlflow_experiment_name: finance-llm-smoke

model:
  model_name_or_path: Qwen/Qwen2.5-0.5B
  load_in_4bit: false
  load_in_8bit: false
  torch_dtype: float32
  trust_remote_code: true

peft:
  peft_type: LORA
  task_type: CAUSAL_LM
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  experiment_name: smoke-lora
  num_train_epochs: 1
  max_steps: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: constant
  logging_steps: 1
  eval_steps: 3
  save_steps: 3
  save_total_limit: 1
  fp16: false
  bf16: false
  gradient_checkpointing: false
  dataloader_num_workers: 0
  max_seq_length: 256
  output_dir: ./experiments/smoke
